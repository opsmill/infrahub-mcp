---
# yamllint disable rule:truthy
name: Publish Infrahub Sync Package

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      version:
        type: string
        required: false
        description: The string to extract semver labels from.
        default: ''
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false
      prerelease:
        type: boolean
        description: Whether the release is a pre-release (tags the image `preview` instead of `stable`)
        required: false
        default: false
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      version:
        type: string
        required: false
        description: The string to extract semver labels from.
        default: ''
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false
      prerelease:
        type: boolean
        description: Whether the release is a pre-release (tags the image `preview` instead of `stable`)
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish_to_pypi:
    name: Publish Infrahub MCP to PyPI
    runs-on: ${{ inputs.runs-on || 'ubuntu-22.04' }}
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Install deps (locked)
        run: uv sync --all-extras --frozen

      - name: Build dists
        run: uv build

      - name: Show artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        if: ${{ inputs.publish == true }}
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}"

  docker_meta:
    name: Compute docker image metadata
    runs-on: ubuntu-24.04
    needs: publish_to_pypi
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Set GIT ref
        id: ref
        run: echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Same tagging scheme as opsmill/infrahub: every published release gets
      # its version plus a `stable` or `preview` channel tag; full releases
      # also get `vX.Y`. `latest` only moves when this version is GitHub's
      # latest release, so a patch on an older line does not drag it back.
      - name: Resolve channel tags
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          CHANNEL=""
          MAJOR_MINOR=""
          IS_LATEST=false

          if [ "${PUBLISH}" = "true" ]; then
            if [ "${PRERELEASE}" = "true" ]; then
              CHANNEL=preview
            else
              CHANNEL=stable
              # v1.2.0 -> v1.2; anything that is not a plain X.Y.Z gets none.
              MAJOR_MINOR=$(printf '%s' "${VERSION}" | sed -nE 's/^(v?[0-9]+\.[0-9]+)\.[0-9]+$/\1/p')
            fi

            LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" = "${VERSION}" ]; then
              IS_LATEST=true
            fi
            echo "GitHub latest release: ${LATEST_TAG:-<none>}; publishing ${VERSION}; latest=${IS_LATEST}"
          fi

          {
            echo "channel=${CHANNEL}"
            echo "major_minor=${MAJOR_MINOR}"
            echo "latest=${IS_LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Set docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.HARBOR_HOST }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=${{ steps.channel.outputs.major_minor }}
            type=raw,value=${{ steps.channel.outputs.channel }}
          flavor: |
            latest=${{ steps.channel.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

  publish_docker_image:
    name: Build and publish container image
    needs: docker_meta
    uses: ./.github/workflows/ci-docker-image.yml
    secrets: inherit
    with:
      publish: ${{ inputs.publish }}
      version: ${{ inputs.version }}
      ref: ${{ needs.docker_meta.outputs.ref }}
      tags: ${{ needs.docker_meta.outputs.tags }}
      labels: ${{ needs.docker_meta.outputs.labels }}
