---
# yamllint disable rule:truthy
name: Auto bump version

on:
  push:
    branches: [stable]

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Guard: skip bot commits to prevent infinite loops
  # ---------------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check commit author and message
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.username }}
        run: |
          set -euo pipefail

          # Skip the bot's own commits so preparing a release cannot trigger
          # preparing another. The merge of a release pull request only says
          # `chore(release):` when that pull request was squashed or rebased —
          # a merge commit says `Merge pull request #...` and matches neither
          # subject below. Merge commits are enabled on this repository, so
          # ask the API which pull requests this commit belongs to instead:
          # that holds for all three merge strategies.
          RELEASE_PR=$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[]
                     | select(.merged_at != null)
                     | select(.head.ref | startswith("release/v"))
                     | .number] | first // empty'
          )

          # The subject and author checks stay as a cheap fallback: they cost
          # nothing and still recognise a direct push by the bot.
          if [ -n "${RELEASE_PR}" ]; then
            echo "Release PR #${RELEASE_PR} merged here — not preparing another."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$MSG" == chore\(release\):* ]] || [[ "$MSG" == "chore: sync version"* ]]; then
            echo "Skipping: bot commit message detected"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$AUTHOR" == "opsmill-bot" ]]; then
            echo "Skipping: opsmill-bot author detected"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Bump: calculate the next version, assemble the changelog, open a release PR
  #
  # Nothing is pushed to `stable` directly and no tag is created here. The
  # version bump and the assembled changelog land as a reviewable pull
  # request; merging it is the act that authorises the release, and
  # release-publish.yml then creates the tag and the GitHub Release.
  #
  # The version is computed in its own step whose sole output is a version
  # string. That is the seam for a later migration onto the shared
  # `release-prepare` workflow, which accepts exactly that as
  # `bump-strategy: manual` + `version:`.
  # ---------------------------------------------------------------------------
  bump:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.next-version }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install mcp-discovery
        # yamllint disable rule:line-length
        env:
          MCP_DISCOVERY_VERSION: "0.2.5"
          MCP_DISCOVERY_SHA256: "ede19b0e8a6d960ddb3cf0abd7d33e791ad94aecfe65d94c33c6011bd5291ba9"
        run: |
          # Extract to a tmp dir so stray bundled files (LICENSE, README,
          # etc.) never land in the working tree and get picked up by
          # `git add -A` in the bump commit.
          TMPDIR=$(mktemp -d)
          curl -sL "https://github.com/rust-mcp-stack/mcp-discovery/releases/download/v${MCP_DISCOVERY_VERSION}/mcp-discovery-x86_64-unknown-linux-gnu.tar.xz" \
            -o "${TMPDIR}/mcp-discovery.tar.xz"
          echo "${MCP_DISCOVERY_SHA256}  ${TMPDIR}/mcp-discovery.tar.xz" | sha256sum -c
          tar -xJf "${TMPDIR}/mcp-discovery.tar.xz" -C "${TMPDIR}" --strip-components=1
          sudo mv "${TMPDIR}/mcp-discovery" /usr/local/bin/
          rm -rf "${TMPDIR}"
        # yamllint enable rule:line-length

      - name: Calculate next version from PR labels
        uses: patrickjahns/version-drafter-action@v1.3.1
        id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}

      - name: Compare with current version
        id: compare
        run: |
          CURRENT=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          NEXT="${{ steps.next.outputs.next-version }}"
          echo "Current: $CURRENT"
          echo "Next:    $NEXT"

          if [ "$CURRENT" = "$NEXT" ]; then
            echo "No version change needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bump: $CURRENT -> $NEXT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync versions to all files
        if: steps.compare.outputs.changed == 'true'
        run: bash scripts/sync-versions.sh "${{ steps.next.outputs.next-version }}"

      - name: Regenerate CAPABILITIES.md
        if: steps.compare.outputs.changed == 'true'
        run: bash scripts/update-capabilities.sh

      - name: Assemble the changelog
        if: steps.compare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.next.outputs.next-version }}
        run: |
          set -euo pipefail

          # A release must say what changed. Fail loudly rather than tag a
          # version whose notes are empty — the same rule the shared
          # changelog-towncrier composite enforces, with no opt-out.
          shopt -s nullglob
          FRAGMENTS=(changelog/*.md)
          KEPT=()
          for f in "${FRAGMENTS[@]}"; do
            [ "$f" = "changelog/towncrier.md.template" ] && continue
            # An empty fragment still counts towards the total below, so the
            # release would proceed and towncrier would render the file as a
            # heading with nothing under it. Name the file and stop: only the
            # author knows what it was meant to say.
            if ! grep -q '[^[:space:]]' "$f"; then
              MSG="News fragment ${f} has no content — it would render as an"
              MSG="${MSG} empty entry. Describe the change in it, or delete"
              MSG="${MSG} the file."
              echo "::error::${MSG}"
              exit 1
            fi
            KEPT+=("$f")
          done
          if [ ${#KEPT[@]} -eq 0 ]; then
            MSG="No news fragments in changelog/ — refusing to cut"
            MSG="${MSG} v${VERSION} with an empty changelog."
            MSG="${MSG} Add a fragment (housekeeping is fine) and re-run."
            echo "::error::${MSG}"
            exit 1
          fi

          uv run towncrier build --version "${VERSION}" --yes

      - name: Open the release pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          VERSION: ${{ steps.next.outputs.next-version }}
        run: |
          set -euo pipefail
          export BRANCH="release/v${VERSION}"

          git config user.name "opsmill-bot"
          git config user.email "opsmill-bot@users.noreply.github.com"
          git switch -c "${BRANCH}"

          # Stage only what the bump and changelog assembly are allowed to
          # touch. `git add -A` would sweep up stray files dropped by
          # third-party tools (e.g. mcp-discovery tarball contents).
          git add pyproject.toml server.json uv.lock CAPABILITIES.md \
                  CHANGELOG.md changelog/
          git commit -m "chore(release): v${VERSION}"

          # Re-running on a later push to stable refreshes the same branch
          # rather than opening a second PR for the same version. Plain
          # --force rather than --force-with-lease: checkout does not fetch
          # this branch's remote ref, so a lease has nothing to compare
          # against. The branch is bot-owned and regenerated every run.
          git push --force origin "${BRANCH}"

          # A run that computes a different version opens a different branch,
          # so an earlier release PR can still be open. Merging that one after
          # this one would walk the version files back and let release-publish
          # tag a version older than the one already released — supersede it
          # rather than let the two race.
          STALE=$(
            gh pr list --state open --base stable --json number,headRefName \
              --jq '.[]
                    | select(.headRefName | startswith("release/v"))
                    | select(.headRefName != env.BRANCH)
                    | .number'
          )
          for PR in ${STALE}; do
            echo "Closing release PR #${PR}, superseded by ${BRANCH}."
            gh pr close "${PR}" \
              --comment "Superseded by the release pull request for v${VERSION}."
          done

          # Only an *open* pull request counts as one already prepared:
          # `gh pr view <branch>` resolves closed and merged ones too, so a
          # release PR closed without merging would otherwise be mistaken for
          # the current one and leave the version stranded on the branch with
          # nothing to merge.
          OPEN_PR=$(
            gh pr list --head "${BRANCH}" --state open --json number \
              --jq '.[0].number // empty'
          )
          if [ -n "${OPEN_PR}" ]; then
            echo "Release PR #${OPEN_PR} for ${BRANCH} already open — updated in place."
            exit 0
          fi

          gh pr create \
            --base stable \
            --head "${BRANCH}" \
            --title "chore(release): v${VERSION}" \
            --label "ci/skip-changelog" \
            --body "$(cat <<EOF
          Prepared automatically. Merging this pull request authorises the release:
          \`release-publish.yml\` then tags \`v${VERSION}\` and publishes the GitHub
          Release using the changelog section below.

          - Version bumped to \`${VERSION}\` across \`pyproject.toml\`, \`server.json\` and \`CAPABILITIES.md\`
          - \`CHANGELOG.md\` assembled from the news fragments, which are consumed by this commit

          Review the assembled changelog before merging — it is what users will read.
          EOF
          )"
