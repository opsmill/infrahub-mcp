---
# yamllint disable rule:truthy
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate pyproject.toml version matches tag
        run: |
          PYPROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PYPROJECT_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi

      - name: Validate server.json versions match tag
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          TOP_VERSION=$(jq -r .version server.json)
          PKG_VERSION=$(jq -r '.packages[0].version' server.json)
          if [ "$TOP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: server.json .version=$TOP_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: server.json .packages[0].version=$PKG_VERSION, tag=v$TAG_VERSION"
            exit 1
          fi

  capabilities:
    uses: ./.github/workflows/ci-mcp-discovery.yml

  publish:
    needs: [validate, capabilities]
    uses: ./.github/workflows/workflow-publish.yml
    secrets: inherit
    with:
      publish: true
      prerelease: ${{ github.event.release.prerelease }}
      version: ${{ github.ref_name }}

  # Tell opsmill/infrahub-helm about the release once its image is published, so
  # its "Update infrahub-mcp" workflow opens a pull request that moves
  # charts/infrahub-mcp to this version. Only the latest full release is sent:
  # the chart follows the newest version, not a patch on an older release line.
  notify-helm:
    needs: [publish]
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send infrahub-mcp-released to opsmill/infrahub-helm
        env:
          GH_TOKEN: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$REPOSITORY/releases/latest" -q .tag_name)" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest release; infrahub-helm is not notified."
            exit 0
          fi
          gh api "repos/opsmill/infrahub-helm/dispatches" \
            -f event_type=infrahub-mcp-released \
            -f "client_payload[version]=$TAG"
          echo "Sent infrahub-mcp-released for $TAG to opsmill/infrahub-helm."
