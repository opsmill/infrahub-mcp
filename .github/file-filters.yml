---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

doc_files: &doc_files
  - "docs/**"

python_all: &python_all
  - "**/*.py"
  # Linter settings and the resolved linter versions CI installs. Without these,
  # a dependency bump can change what `ruff check .` reports while python-lint
  # never runs on the PR that makes the change.
  - "pyproject.toml"
  - "uv.lock"

mcp_all: &mcp_all
  - "src/**"
  - "docker-compose.yml"
  - "pyproject.toml"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

documentation_all:
  - *doc_files
  - *markdown_all

# Inputs the unit tests read besides Python sources: the workflow guards in
# tests/unit/test_release_pipeline.py and the curated release-notes pages
# rendered by tests/unit/test_release_body.py. Changing only these must still
# run pytest, or those regression tests never see the change they guard.
unit_tests_all:
  - *python_all
  - *ci_config
  - *github_workflows
  - "docs/docs/release-notes/**"
