---
# Every hook runs the tool from the project's uv environment rather than a pinned
# mirror revision, so pre-commit, `invoke lint`, and CI always agree on versions.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      # Scoped to src/ like `invoke lint-mypy`; `files` keeps the hook from
      # running (and reporting success) when only tests changed. Whole-repo type
      # checking is CI's `ty check .`.
      - id: mypy
        name: mypy
        entry: uv run mypy --show-error-codes src/
        language: system
        types_or: [python, pyi]
        files: ^src/
        pass_filenames: false
      - id: rumdl
        name: rumdl
        entry: uv run rumdl check
        language: system
        types_or: [markdown, mdx]
